name: build-push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'app-config*.yaml'
      - 'packages/**'
      - 'plugins/**'
      - 'catalog/**'
      - 'package.json'
      - 'yarn.lock'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/guslopezc/backstage:${{ github.sha }}
            docker.io/guslopezc/backstage:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max