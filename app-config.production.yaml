# Backstage override configuration for your local development environment
app:
  listen:
    host: 0.0.0.0
    port: 7007
  baseUrl: https://backstage.local
  doraMetrics:
    environments:
      - name: Production
        branch: main
        isProduction: true
        label: hotfix
    collection:
      initialDays: 30
    targets:
      deploymentFrequency: 7
      leadTime: 24
      changeFailureRate: 15
      mttr: 1
backend:
  baseUrl: https://backstage.local
  listen:
    port: 7007
    host: 0.0.0.0
  reading:
    allow:
      - host: raw.githubusercontent.com
      - host: github.com

  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: 5432
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        ## uncomment if using GitHub Enterprise
        # enterpriseInstanceUrl: ${AUTH_GITHUB_ENTERPRISE_INSTANCE_URL}
        signIn:
          resolvers:
            # Matches the GitHub username with the Backstage user entity name.
            # See https://backstage.io/docs/auth/github/provider#resolvers for more resolvers.
            - resolver: usernameMatchingUserEntityName


catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template]
  locations:
    # Local entity files
    - type: file
      target: /app/entities/users.yaml
      rules:
        - allow: [User]

    - type: file
      target: /app/entities/groups.yaml
      rules:
        - allow: [Group]

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: k3s
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          skipMetricsLookup: true
  customResources:
    - group: 'wgpolicyk8s.io'
      apiVersion: 'v1alpha2'
      plural: 'policyreports'
    - group: 'example.crossplane.io'
      apiVersion: 'v1alpha1'
      plural: 'localdeployments'
 

# Kyverno Policy Reports
kyverno:
  enablePermissions: false

search:
  pg:
    highlightOptions:
      useHighlight: true
      maxWordsBefore: 30
      maxWordsAfter: 30
  collators:
    catalog:
      schedule:
        frequency:
          minutes: 5
        timeout:
          minutes: 3
    techdocs:
      schedule:
        frequency:
          minutes: 10
        timeout:
          minutes: 5

# Kubernetes Resources — TeraSky permissions backend
kubernetesResources:
  enablePermissions: true
  annotationPrefix: terasky.backstage.io
  concurrency: 10

techdocs:
  builder: 'local'
  publisher:
    type: 'local'
  generator:
    runIn: local


integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}

opencost:
  baseUrl: https://backstage.local/api/proxy/opencost
